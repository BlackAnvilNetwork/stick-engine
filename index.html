<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stick Engine</title>
  <link data-trunk rel="rust" href="crates/stick_web/Cargo.toml" data-wasm-opt="z" />
  <style>
    html, body { margin: 0; height: 100%; background: #08070c; color: #9a93a8; font: 13px monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { width: min(100vw, calc((100vh - 40px) * 16 / 9)); aspect-ratio: 16 / 9;
             image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
    p { margin: 8px; }
  </style>
</head>
<body>
  <canvas id="screen" tabindex="0"></canvas>
  <p>WASD move · Shift run · Space dash · Left click / J swing · Right click move-to · add #demo to the URL for autoplay</p>
