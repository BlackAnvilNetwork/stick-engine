[package]
license = "AGPL-3.0-or-later"
name = "stick_web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stick_engine = { path = "../stick_engine" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "DomRect", "Location"] }
