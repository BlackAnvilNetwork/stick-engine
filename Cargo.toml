[workspace]
resolver = "2"
members = ["crates/stick_engine", "crates/stick_web", "crates/stick_native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
