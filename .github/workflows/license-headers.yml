name: license-headers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/add-license-headers.mjs --check
